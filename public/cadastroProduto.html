<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/authGuard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/style.css">
    <title>New Tech - Cadastrar Produto</title>
</head>
<body>
    <header>
        <h1 class="titulo-pagina">New Tech - Cadastro de produtos</h1>
    </header>
    <nav>
        <ul class="options-nav">
            <li><a class="btn btn-outline-primary" href="estoque.html">Lista de Produtos</a></li>
            <li><a class="btn btn-outline-primary" href="cadastroProduto.html">Cadastrar Produto</a></li>   
        </ul>
    </nav>
    <section class="product-section">
        <h1>Cadastrar Novo Produto</h1>
        
        <form id="form-cadastro" class="container">
            <div class="form-group mb-2">
                <label for="nome" class="form-label">Nome do Produto:</label><br>
                <input type="text" id="nome" class="form-control" required maxlength="80">
            </div>

            <div class="form-group mb-2">
                <label for="preco" class="form-label">Preço (R$):</label><br>
                <input type="number" id="preco" class="form-control" required step="0.01" min="0">
            </div>

            <div class="form-group mb-2">
                <label for="quantidade" class="form-label">Quantidade em Estoque:</label><br>
                <input type="number" id="quantidade" class="form-control" required min="0">
            </div>

            <div class="form-group mb-2">
                <label for="descricao" class="form-label">Descrição do Produto:</label><br>
                <textarea id="descricao" required maxlength="800" rows="4" class="form-control"></textarea>
            </div>

            <div class="form-group mb-2">
                <label for="imagem"></label><br>
                <input type="file" id="imagem" class="form-control" required accept="image/png, image/jpeg, image/jpg, image/webp">
            </div>
            <br>

            <button type="submit" class="botao-login btn btn-primary">Cadastrar Produto</button>
        </form>
    </section>

    <script src="./scripts/cadastrarProduto.js"></script> 
</body>
</html>
