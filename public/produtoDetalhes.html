<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="/scripts/authGuard.js"></script>
    <link rel="stylesheet" href="./styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>New Tech - Detalhes do Produto</title>
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-4 text-primary">Detalhes do Produto</h2>
            
            <div class="text-center mb-4">
                <img id="preview-imagem" src="" alt="Imagem do produto" class="img-thumbnail" style="max-height: 200px;">
            </div>

            <form id="form-edicao">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text" class="form-control" id="nome" disabled required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="preco" disabled required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="quantidade" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="quantidade" disabled required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea class="form-control" id="descricao" rows="3" disabled></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="estoque.html" class="btn btn-secondary me-md-2">Voltar</a>
                    <button type="button" id="btn-editar" class="btn btn-warning">Editar Dados</button>
                    <button type="submit" id="btn-salvar" class="btn btn-success d-none">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./scripts/produtoDetalhes.js"></script>
</body>
</html>
